apiVersion: v1
kind: Secret
metadata:
  name: {{.Values.registrySecretName}}
  namespace: {{.Values.namespace}}
  annotations:
    harness.io/skip-versioning: "true"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "pkg.harness.io": {
          "username": "{{.Values.registryUsername}}",
          "password": "{{.Values.registryPassword}}"
        }
      }
    }